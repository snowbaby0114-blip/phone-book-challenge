services:
  postgres:
    container_name: 'phone-book-postgres'
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - 9445:5432
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    environment:
      - POSTGRES_DB=phone-book
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=123456789
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d phone-book"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    driver: local
